
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-delivery-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Harshada-07650/gitops-automated-delivery.git
    targetRevision: main
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
